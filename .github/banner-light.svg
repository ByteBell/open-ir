<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img"
           aria-label="Plumbline — local-first code intelligence. A plumb bob hangs on a true vertical cord; below it the cord becomes a graph spine linking the smart_search, keyword_lookup and retrieve_file nodes.">
        <defs>
          <pattern id="gl" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M32 0H0v32" fill="none" stroke="#C9CEC2" stroke-width="1" opacity=".55"/>
          </pattern>
          <linearGradient id="bl" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#7E5518"/><stop offset=".38" stop-color="#D9A441"/>
            <stop offset=".62" stop-color="#A8762B"/><stop offset="1" stop-color="#6E4915"/>
          </linearGradient>
          <marker id="al" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6"
                  markerHeight="6" orient="auto">
            <path d="M0 1 L9 5 L0 9 z" fill="#55605B"/>
          </marker>
        </defs>

        <rect width="1280" height="640" fill="#E9EBE4"/>
        <rect width="1280" height="640" fill="url(#gl)"/>
        <rect x="24.5" y="24.5" width="1231" height="591" fill="none"
              stroke="#C9CEC2" stroke-width="1"/>

        <g fill="none" stroke="#1A211E" stroke-width="1.5" opacity=".5">
          <path d="M24 56V24h32"/><path d="M1224 24h32v32"/>
          <path d="M24 584v32h32"/><path d="M1256 584v32h-32"/>
        </g>

        <!-- text column -->
        <text x="96" y="150" font-family="'IBM Plex Mono',monospace" font-size="13"
              letter-spacing="4.5" fill="#A8762B">BYTEBELL</text>
        <text x="94" y="258" font-family="Archivo,sans-serif" font-size="108"
              font-weight="800" letter-spacing="-3.2" fill="#1A211E">PLUMBLINE</text>
        <path d="M96 286H690" stroke="#A8762B" stroke-width="2.5"/>
        <text x="96" y="332" font-family="Archivo,sans-serif" font-size="28"
              font-weight="500" fill="#1A211E">Local-first code intelligence</text>
        <text x="96" y="370" font-family="'IBM Plex Mono',monospace" font-size="14"
              fill="#55605B">every file analyzed &#8594; knowledge graph &#8594; served over MCP</text>
        <text x="96" y="394" font-family="'IBM Plex Mono',monospace" font-size="14"
              fill="#55605B">nothing leaves 127.0.0.1</text>

        <!-- title block -->
        <g stroke="#C9CEC2" stroke-width="1">
          <path d="M96 470h336M96 501.5h336M96 533h336M96 564.5h336M96 596h336"/>
          <path d="M96 470v126M232 470v126M432 470v126"/>
        </g>
        <g font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1.4">
          <text x="108" y="491" fill="#55605B">PROJECT</text>
          <text x="244" y="491" fill="#1A211E">PLUMBLINE</text>
          <text x="108" y="522.5" fill="#55605B">GRAPH</text>
          <text x="244" y="522.5" fill="#1A211E">NEO4J + MONGO</text>
          <text x="108" y="554" fill="#55605B">SERVES</text>
          <text x="244" y="554" fill="#1A211E">MCP / STDIO + HTTP</text>
          <text x="108" y="585.5" fill="#55605B">BIND</text>
          <text x="244" y="585.5" fill="#1A211E">127.0.0.1 LOCAL ONLY</text>
        </g>

        <!-- dimension line -->
        <path d="M770 48V414" stroke="#55605B" stroke-width="1"
              marker-start="url(#al)" marker-end="url(#al)" opacity=".8"/>
        <text x="758" y="231" font-family="'IBM Plex Mono',monospace" font-size="11"
              letter-spacing="2.6" fill="#55605B" text-anchor="middle"
              transform="rotate(-90 758 231)">TRUE VERTICAL</text>

        <!-- unindexed tangle -->
        <g opacity=".3">
          <path d="M1096 418C1140 440 1120 500 1152 466M1112 528C1150 520 1160 552 1168 566M1064 590C1090 560 1104 544 1112 528"
                fill="none" stroke="#55605B" stroke-width="1" stroke-dasharray="3 4"/>
          <g fill="#55605B">
            <circle cx="1096" cy="418" r="3.5"/><circle cx="1152" cy="466" r="3.5"/>
            <circle cx="1112" cy="528" r="3.5"/><circle cx="1168" cy="566" r="3.5"/>
            <circle cx="1064" cy="590" r="3.5"/>
          </g>
        </g>

        <!-- cord + bob -->
        <path d="M880 44V266" stroke="#55605B" stroke-width="1.25"/>
        <rect x="873" y="264" width="14" height="10" fill="#A8762B"/>
        <path d="M880 274 L892 294 C900 314 900 342 894 362 L880 414 L866 362
                 C860 342 860 314 868 294 Z" fill="url(#bl)"/>
        <path d="M880 274 L868 294 C860 314 860 342 866 362 L880 414 Z"
              fill="#D9A441" opacity=".28"/>

        <!-- graph spine: the cord's axis, continued -->
        <path d="M880 414V552" stroke="#A8762B" stroke-width="1.25" opacity=".65"/>
        <g stroke="#55605B" stroke-width="1" opacity=".55">
          <path d="M880 432H812M880 492H812M880 552H812"/>
        </g>
        <g fill="#A8762B">
          <circle cx="880" cy="432" r="5"/><circle cx="880" cy="492" r="5"/>
          <circle cx="880" cy="552" r="5"/>
        </g>
        <g fill="#55605B">
          <circle cx="812" cy="432" r="3.5"/><circle cx="812" cy="492" r="3.5"/>
          <circle cx="812" cy="552" r="3.5"/>
        </g>
        <g font-family="'IBM Plex Mono',monospace" font-size="12.5" fill="#1A211E">
          <text x="906" y="436">smart_search</text>
          <text x="906" y="496">keyword_lookup</text>
          <text x="906" y="556">retrieve_file</text>
        </g>
      </svg>
