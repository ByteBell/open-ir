# Compose project name. Without this, Compose derives the project from the parent
# directory and every resource lands under a project called `docker` -- the CLI
# invokes `docker compose -f <abs path> up -d` with no `-p` flag
# (packages/cli/src/dockerInfra.ts), so this key is the only thing naming it.
name: plumbline

# Every service caps its json-file log. Docker's default is UNBOUNDED, and these
# logs live on the ~31GB Docker VM disk, not the host filesystem. When that disk
# fills, writes fail in ways that surface as unrelated application errors — a
# service looks broken when the real fault is disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  neo4j:
    image: neo4j:5
    container_name: plumbline-neo4j
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in infra/docker/.env}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      # Neo4j keeps 2 days of write-ahead transaction logs by default, which for
      # a bulk ingestion run means /data/transactions dwarfs the actual store
      # (observed: 515MB of tx logs against a 5.4MB database). Cap by size —
      # ingestion is a local, restartable pipeline, so there is nothing here to
      # replay into a cluster or a backup window.
      NEO4J_db_tx__log_rotation_retention__policy: "256M size"
      # Bound the JVM instead of letting it size itself from the container's view
      # of host RAM; an unbounded page cache on a laptop starves the ingestion
      # worker running alongside it.
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1G}"
    networks:
      - plumbline
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  ladybug-explorer:
      image: ghcr.io/ladybugdb/explorer:latest
      container_name: plumbline-ladybug-explorer
      restart: unless-stopped
      logging: *default-logging
      ports:
        - "127.0.0.1:8000:8000"
      volumes:
        - ${HOME}/.plumbline:/database:ro
      environment:
        - LBUG_FILE=ladybug.lbug
      networks:
        - plumbline

networks:
  plumbline:
    name: plumbline
    driver: bridge

volumes:
  neo4j_data:
    name: plumbline_neo4j_data
